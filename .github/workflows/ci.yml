name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check pkg/ tests/ cmd/
      - run: pytest tests/
      # The benchmark asserts the model beats every feasible baseline. A regression in
      # model quality fails the build, the same as a broken test would.
      - run: python cmd/benchmark.py
