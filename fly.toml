# fly launch --copy-config --no-deploy && fly volumes create kavach_data -s 1 -r bom
# fly secrets set RAZORPAY_KEY_ID=... RAZORPAY_KEY_SECRET=... KAVACH_MODE=live
# fly deploy
app = "kavach"
primary_region = "bom"

[build]

[env]
  KAVACH_DB = "/data/kavach.db"
  KAVACH_DEMO = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"

[mounts]
  source = "kavach_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
